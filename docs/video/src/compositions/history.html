<template>
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 100 700;
      src: url("assets/fonts/ibm-plex-sans-latin.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
    }
    /* The camera: the app window sits in it at its real size, 24px down, and
       every move is one transform on this wrapper. */
    #h-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
    }
    #h-win {
      position: absolute;
      left: 0;
      top: 24px;
      width: 1920px;
      height: 1032px;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid #252d4a;
      box-shadow: 0 40px 120px rgb(0 0 0 / 0.55);
    }
    #h-win img {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1032px;
    }
    #h-menu {
      z-index: 2;
    }
    #h-cursor {
      position: absolute;
      left: 0;
      top: 24px;
      width: 40px;
      height: 40px;
      z-index: 5;
    }
    #h-cap {
      position: absolute;
      left: 192px;
      bottom: 128px;
      z-index: 6;
    }
    #h-cap-box {
      display: inline-block;
      padding: 16px 26px;
      border-radius: 14px;
      border: 1px solid rgb(0 229 255 / 0.35);
      background: rgb(5 7 18 / 0.9);
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 46px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #f4f8ff;
      white-space: nowrap;
    }
    #h-cap-accent {
      color: #00e5ff;
    }
  </style>

  <div
    id="root"
    data-composition-id="history"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"lead","type":"string","label":"Caption","default":"Menus name"},{"id":"accent","type":"string","label":"Caption accent","default":"their target"}]'
  >
    <div id="h-cam" data-layout-allow-overflow>
      <div id="h-win">
        <img
          id="h-shot"
          class="clip"
          data-start="0"
          data-duration="3.3"
          data-track-index="1"
          src="assets/shots/01-history.png"
          alt=""
        />
        <!-- The same window one right-click later: a hard swap, as in the app. -->
        <img
          id="h-menu"
          class="clip"
          data-start="1.05"
          data-duration="1.7"
          data-track-index="2"
          src="assets/shots/02-history-menu.png"
          alt=""
        />
      </div>
      <svg id="h-cursor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 2.5 L4 19.5 L8.6 15.4 L11.6 22 L14.4 20.8 L11.5 14.3 L17.6 14.1 Z"
          fill="#f4f8ff"
          stroke="#050712"
          stroke-width="1.4"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div id="h-cap" class="clip" data-start="1.15" data-duration="1.8" data-track-index="3">
      <div id="h-cap-box">
        <span data-var-text="lead">Menus name</span>
        <span id="h-cap-accent" data-var-text="accent">their target</span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const W = 1920;
      const H = 1080;
      const TOP = 24;
      const BOTTOM = 1056;
      // Camera state that puts the stage point (fx, fy) at the screen point
      // (cx, cy) at scale s, never showing past an edge of the window.
      const cam = (s, fx, fy, cx = W / 2, cy = H / 2) => {
        if (s <= 1) return { scale: s, x: (W - W * s) / 2, y: (H - H * s) / 2 };
        const x = Math.min(0, Math.max(W - W * s, cx - fx * s));
        const y = Math.min(-TOP * s, Math.max(H - BOTTOM * s, cy - fy * s));
        return { scale: s, x, y };
      };

      const wide = cam(0.9);
      const menu = cam(1.45, 760, 576);
      const files = cam(1.3, 1482, 503, 1350, 540);

      const tl = gsap.timeline({ paused: true });

      // The window is already there on the first frame, and settles.
      tl.fromTo("#h-cam", { ...cam(0.94) }, { ...wide, duration: 0.6, ease: "expo.out" }, 0);

      // The cursor comes in from off-screen and right-clicks a commit.
      tl.fromTo("#h-cursor", { x: 2060, y: 880, scale: 1 }, { x: 540, y: 239, duration: 0.65, ease: "power3.out" }, 0.3);
      tl.fromTo("#h-cursor", { scale: 1 }, { scale: 0.82, duration: 0.06, ease: "power2.in", immediateRender: false }, 0.98);
      tl.fromTo("#h-cursor", { scale: 0.82 }, { scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, 1.04);

      // Push in on the menu the click opened.
      tl.fromTo("#h-cam", { ...wide }, { ...menu, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 1.1);

      tl.fromTo("#h-cap-box", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 1.15);
      tl.fromTo("#h-cap-box", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", immediateRender: false }, 2.76);

      // The menu closes; the camera and the cursor go to the commit's files.
      tl.fromTo("#h-cam", { ...menu }, { ...files, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 2.65);
      tl.fromTo("#h-cursor", { x: 540, y: 239 }, { x: 1300, y: 479, duration: 0.43, ease: "power3.inOut", immediateRender: false }, 2.72);
      tl.fromTo("#h-cursor", { scale: 1 }, { scale: 0.82, duration: 0.06, ease: "power2.in", immediateRender: false }, 3.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["history"] = tl;
    })();
  </script>
</template>
