<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Yoru Night: the app's own ground and accents (DESIGN.md). */
      :root {
        --ground: #050712;
        --ink: #f4f8ff;
        --cyan: #00e5ff;
        --pink: #ff4fb8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* The app's atmospheric background, as its shell paints it. */
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at top right, rgb(0 229 255 / 0.16), transparent 32%),
          radial-gradient(circle at bottom left, rgb(255 79 184 / 0.1), transparent 30%),
          var(--ground);
      }
      #history {
        z-index: 1;
      }
      #workspace {
        z-index: 2;
      }
      #changes {
        z-index: 3;
      }
      #end {
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground" data-layout-ignore></div>

      <div
        id="history"
        data-composition-id="history"
        data-composition-src="compositions/history.html"
        data-start="0"
        data-duration="3.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="workspace"
        data-composition-id="workspace"
        data-composition-src="compositions/workspace.html"
        data-start="3.3"
        data-duration="2.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="changes"
        data-composition-id="changes"
        data-composition-src="compositions/changes.html"
        data-start="5.6"
        data-duration="3.3"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="8.6"
        data-duration="2.4"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
