name: Pages

# Publishes install.sh so the documented one-liner has a stable, readable URL.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble
        run: |
          mkdir -p site
          cp install.sh site/install.sh
          cat >site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Install YoruMerge</title>
          <h1>Install YoruMerge on Linux</h1>
          <pre>curl -fsSL https://jmoreno22.github.io/yoru-merge/install.sh | sh</pre>
          <p>Downloads the right package for your distribution from the latest
          release. Re-run it to update.</p>
          <p><a href="https://github.com/jmoreno22/yoru-merge">Project on GitHub</a>
          · <a href="install.sh">read the script</a></p>
          HTML

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
