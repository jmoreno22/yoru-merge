name: Pages

# Publishes install.sh so the documented one-liner has a stable, readable URL.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble
        run: |
          mkdir -p site
          cp install.sh site/install.sh
          cat >site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Install YoruMerge</title>
          <h1>Install YoruMerge on Linux</h1>
          <pre>curl -fsSL https://jmoreno22.github.io/yoru-merge/install.sh | sh</pre>
          <p>Downloads the right package for your distribution from the latest
          release. Re-run it to update.</p>
          <p><a href="https://github.com/jmoreno22/yoru-merge">Project on GitHub</a>
          · <a href="install.sh">read the script</a></p>
          HTML

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs them: `pages` to create the deployment through the API,
    # `id-token` to mint the OIDC token that proves where it came from.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
