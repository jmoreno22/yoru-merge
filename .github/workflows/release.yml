name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # tauri-action runs once per platform, so the notes are resolved once here
  # and handed to every matrix leg as a job output.
  changelog:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract the CHANGELOG section for this tag
        id: extract
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)"

          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section for [$version]; using the generic body."
            notes='Cross-platform Git GUI built with Tauri, Angular and Rust.'
          fi

          {
            echo 'body<<YORU_RELEASE_BODY'
            printf '## YoruMerge %s\n\n%s\n\n### Downloads\n- **Windows**: `.exe` or `.msi` installer\n- **Linux**: `curl -fsSL https://jmoreno22.github.io/yoru-merge/install.sh | sh`, or the `.deb`, `.rpm` and `.AppImage` below\n' "$TAG" "$notes"
            echo 'YORU_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an AppImage links against the builder's glibc, so bundling on
          # a newer image would narrow the distros the release runs on.
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` — the pinned pnpm comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, bump by hand

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'YoruMerge ${{ github.ref_name }}'
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
