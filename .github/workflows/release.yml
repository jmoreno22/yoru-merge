name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # tauri-action runs once per platform, so the notes are resolved once here
  # and handed to every matrix leg as a job output.
  changelog:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the CHANGELOG section for this tag
        id: extract
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)"

          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section for [$version]; using the generic body."
            notes='Cross-platform Git GUI built with Tauri, Angular and Rust.'
          fi

          {
            echo 'body<<YORU_RELEASE_BODY'
            printf '## YoruMerge %s\n\n%s\n\n### Downloads\n- **Windows**: `.exe` or `.msi` installer\n- **Linux**: `curl -fsSL https://jmoreno22.github.io/yoru-merge/install.sh | sh`, or the `.deb`, `.rpm` and `.AppImage` below\n' "$TAG" "$notes"
            echo 'YORU_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an AppImage links against the builder's glibc, so bundling on
          # a newer image would narrow the distros the release runs on.
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` — the pinned pnpm comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, bump by hand

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'YoruMerge ${{ github.ref_name }}'
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # tauri-action 1.0 writes the API asset URLs into latest.json, which puts
  # every updater download through api.github.com's cap of 60 unauthenticated
  # requests an hour per IP — a shared NAT reaches it and the update fails with
  # 403. The assets already live on github.com; only these URLs did not.
  updater-json:
    name: Point latest.json at github.com
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Rewrite the asset URLs in latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir .

          # The download URL is BUILT from the tag, not read from the asset list.
          # `releaseDraft: true` means this job runs while the release is still a
          # draft, and a draft's asset `url` carries an `untagged-<hash>` path
          # that stops resolving the moment the release is published — reading it
          # here would have traded the API cap for a 404 (v1.0.6, first run).
          # Only the asset NAME is looked up, keyed by the apiUrl latest.json
          # carries, because the platform entries name an asset id and not a file.
          gh release view "$TAG" --json assets \
            --jq '[.assets[] | {key: .apiUrl, value: .name}] | from_entries' >names.json
          jq --slurpfile names names.json \
            --arg base "https://github.com/$GH_REPO/releases/download/$TAG" \
            '.platforms |= map_values(
               .url |= (($names[0][.] // null) as $n | if $n then "\($base)/\($n)" else . end)
             )' latest.json >rewritten.json

          if cmp -s latest.json rewritten.json; then
            echo "::notice::latest.json already points at github.com; nothing to rewrite."
            exit 0
          fi
          # Scoped to the platform URLs on purpose. latest.json embeds the release
          # notes, so a changelog entry that merely NAMES api.github.com tripped a
          # whole-file grep and failed the job after a correct rewrite — the check
          # matching its own documentation (v1.0.6, first run).
          if jq -e '[.platforms[].url] | map(select(test("api[.]github[.]com"))) | length > 0' \
               rewritten.json >/dev/null; then
            echo "::error::latest.json still points at api.github.com after the rewrite."
            exit 1
          fi

          mv rewritten.json latest.json
          gh release upload "$TAG" latest.json --clobber
