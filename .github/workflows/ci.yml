name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential

      # No `version:` — the pinned pnpm comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, bump by hand
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Rust format check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy (no warnings allowed)
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: ./src-tauri
        run: cargo test --all-features

  bundle-smoke:
    name: Bundle smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cold Rust build of the Tauri shell is the slowest thing in CI.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 22.04 to match release.yml: an AppImage links against the
        # builder's glibc, so bundling on a newer image would silently narrow
        # the distros the release runs on.
        os: [ubuntu-22.04, windows-latest]

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, bump by hand

      - name: Cache Cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-bundle-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
            ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Proves the desktop shell actually links and bundles on both platforms,
      # which a frontend-only build cannot catch. The override disables updater
      # artifacts so the smoke needs no signing key (forks have no secrets);
      # release.yml is the signed path.
      - name: Build desktop bundle (debug)
        run: pnpm tauri build --debug --config src-tauri/ci-smoke.conf.json

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` — the pinned pnpm comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
          run_install: false

      # No pnpm store cache: both audits read a lockfile, nothing is installed.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, bump by hand

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust advisories (RustSec)
        working-directory: ./src-tauri
        run: cargo audit

      # Split on purpose: only what ships blocks; the tooling advisories stay visible.
      - name: JS advisories (production)
        if: '!cancelled()'
        run: pnpm audit --prod --audit-level high

      - name: JS advisories (including tooling)
        if: '!cancelled()'
        continue-on-error: true
        run: pnpm audit --audit-level high
