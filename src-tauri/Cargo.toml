[package]
name = "yoru-merge"
version = "1.0.4"
description = "YoruMerge — a fast Git GUI"
authors = ["jhoan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yoru_merge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"
chrono = "0.4"
# libgit2 is only used for local reads; every remote operation goes through the
# git CLI, so the default `ssh`/`https` features would only add libssh2 and OpenSSL.
git2 = { version = "0.21", default-features = false }
# `notify` itself comes from the debouncer so both always agree on a version.
notify-debouncer-full = "0.7"
tempfile = "3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
