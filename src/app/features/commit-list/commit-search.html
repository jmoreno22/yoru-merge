<ng-icon
  name="lucideSearch"
  size="14px"
  class="shrink-0 text-[var(--app-text-muted)]"
  aria-hidden="true"
/>
<input
  #field
  type="search"
  data-escape-clears
  placeholder="Search commits or path:src/app"
  title="Add path:src/app to keep only commits touching that path. Quote it when it has spaces: path:&quot;my docs&quot;."
  data-testid="commit-search-input"
  aria-label="Search commits. Add path: followed by a path to filter by file."
  [attr.aria-busy]="isSearching()"
  [value]="query()"
  (input)="onInput($any($event.target).value)"
  yoruInput="xs"
  class="flex-1 font-mono"
/>
@if (isActive()) {
  <span
    class="shrink-0 font-mono text-y-xs tabular-nums text-[var(--app-text-faint)]"
    data-testid="commit-search-count"
    role="status"
  >
    @if (isSearching()) {
      Searching…
    } @else {
      {{ countLabel() }}
    }
  </span>
  <button
    type="button"
    (click)="onClear()"
    data-testid="commit-search-clear"
    aria-label="Clear search"
    title="Clear search (Esc)"
    yoruIconButton
  >
    <ng-icon name="lucideX" size="14px" aria-hidden="true" />
  </button>
}
