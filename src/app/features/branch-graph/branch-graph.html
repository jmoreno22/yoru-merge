@if (!isEmpty()) {
  <canvas
    #canvas
    data-testid="branch-graph-canvas"
    class="block h-full w-full"
    aria-hidden="true"
    (pointermove)="onPointerMove($event)"
    (pointerleave)="onPointerLeave()"
    (click)="onClick($event)"
  ></canvas>

  @if (landingPoint(); as point) {
    <span
      class="graph-landing"
      aria-hidden="true"
      data-testid="branch-graph-landing"
      [style.left.px]="point.x"
      [style.top.px]="point.y"
    ></span>
  }

  @if (hover(); as target) {
    <div
      class="graph-tooltip"
      role="tooltip"
      data-testid="branch-graph-tooltip"
      [style.top.px]="target.y"
      [style.left.px]="target.x"
    >
      <code class="shrink-0 text-[var(--app-text-faint)]">{{ target.shortSha }}</code>
      <span class="truncate">{{ target.subject }}</span>
    </div>
  }
}
