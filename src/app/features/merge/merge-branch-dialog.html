<yoru-dialog
  [open]="open()"
  [title]="'Merge into ' + (currentBranch() ?? 'HEAD')"
  size="md"
  (closed)="onClose()"
>
  <yoru-field dialog-body label="Branch to merge">
    <input
      type="search"
      cdkFocusInitial
      autocomplete="off"
      spellcheck="false"
      data-testid="merge-search"
      [value]="query()"
      (input)="onQueryInput($event)"
      placeholder="Search local and remote branches"
      class="h-8 w-full rounded-sm border border-[var(--app-border)] bg-[var(--app-surface)] px-2.5 text-[13px] text-[var(--app-text)] placeholder:text-[var(--app-text-faint)] focus:border-neon-cyan focus:outline-none"
    />
  </yoru-field>

  <div dialog-body class="flex min-h-0 flex-col">
    @if (matches().length === 0) {
      <yoru-empty-state
        icon="lucideGitBranch"
        title="No branch matches"
        hint="Clear the search to see every branch."
      />
    } @else {
      <ul
        class="neon-scroll flex max-h-56 flex-col overflow-y-auto rounded-sm border border-[var(--app-border)]"
        role="listbox"
        aria-label="Branches"
        data-testid="merge-branch-list"
      >
        @for (branch of matches(); track branch.name) {
          <li role="option" [attr.aria-selected]="selected() === branch.name">
            <button
              type="button"
              (click)="select(branch.name)"
              [attr.data-testid]="'merge-branch-' + branch.name"
              class="flex h-[30px] w-full items-center gap-2 px-2.5 text-left transition-colors"
              [class]="
                selected() === branch.name
                  ? 'bg-neon-cyan/12 text-neon-cyan'
                  : 'text-[var(--app-text)] hover:bg-[var(--app-panel)]'
              "
            >
              <ng-icon
                [name]="branch.is_remote ? 'lucideGlobe' : 'lucideGitBranch'"
                size="14px"
                aria-hidden="true"
                class="shrink-0"
              />
              <span class="truncate font-mono text-xs">{{ branch.name }}</span>
              @if (branch.is_remote) {
                <span
                  class="ml-auto shrink-0 font-mono text-[10.5px] uppercase tracking-[0.12em] text-[var(--app-text-faint)]"
                >
                  remote
                </span>
              }
            </button>
          </li>
        }
      </ul>
    }
  </div>

  <yoru-field dialog-body label="Strategy">
    <yoru-segmented
      [options]="modeOptions"
      [value]="mode()"
      (valueChange)="onMode($event)"
      ariaLabel="Merge strategy"
    />
  </yoru-field>

  @if (preview(); as text) {
    <p
      dialog-body
      class="text-[13px] text-[var(--app-text-muted)]"
      data-testid="merge-preview"
    >
      {{ text }}
    </p>
  }

  @if (ffBlockedReason(); as reason) {
    <p
      dialog-body
      role="alert"
      class="text-[13px] text-[var(--app-conflict-text)]"
      data-testid="merge-ff-reason"
    >
      {{ reason }}
    </p>
  }

  <yoru-button dialog-actions variant="ghost" (click)="onClose()">
    Cancel
  </yoru-button>
  <yoru-button
    dialog-actions
    variant="primary"
    icon="lucideGitMerge"
    [loading]="busy()"
    [disabled]="!canMerge()"
    data-testid="merge-submit"
    (click)="onMerge()"
  >
    Merge
  </yoru-button>
</yoru-dialog>
