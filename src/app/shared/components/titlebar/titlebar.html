<div
  class="flex shrink-0 items-center gap-1.5 pl-3 pr-2"
  data-tauri-drag-region
  data-testid="titlebar-brand"
>
  <span
    class="font-display text-y-sm tracking-[0.08em] text-[var(--app-text)]"
    data-tauri-drag-region
  >
    YoruMerge
  </span>
  <span
    class="font-mono text-y-sm text-[var(--app-text-faint)]"
    data-tauri-drag-region
    aria-hidden="true"
  >
    ヨル
  </span>
</div>

<app-workspace-tabs />

<!-- The window has no decorations, so the empty strip is the drag handle. -->
<div class="min-w-6 flex-1" data-tauri-drag-region></div>

<div class="flex shrink-0 items-stretch" data-testid="window-controls">
  <button
    type="button"
    aria-label="Minimize window"
    [yoruTooltip]="'Minimize'"
    (click)="onMinimize()"
    data-testid="window-minimize"
    class="flex w-11 items-center justify-center text-[var(--app-text-muted)] transition-colors hover:bg-[var(--app-panel)] hover:text-[var(--app-text)]"
  >
    <ng-icon name="lucideMinus" size="15px" aria-hidden="true" />
  </button>
  <button
    type="button"
    [attr.aria-label]="maximized() ? 'Restore window' : 'Maximize window'"
    [yoruTooltip]="maximized() ? 'Restore' : 'Maximize'"
    (click)="onToggleMaximize()"
    data-testid="window-maximize"
    class="flex w-11 items-center justify-center text-[var(--app-text-muted)] transition-colors hover:bg-[var(--app-panel)] hover:text-[var(--app-text)]"
  >
    <ng-icon
      [name]="maximized() ? 'lucideMinimize2' : 'lucideSquare'"
      size="14px"
      aria-hidden="true"
    />
  </button>
  <button
    type="button"
    aria-label="Close window"
    [yoruTooltip]="'Close'"
    (click)="onClose()"
    data-testid="window-close"
    class="flex w-11 items-center justify-center text-[var(--app-text-muted)] transition-colors hover:bg-git-deleted hover:text-moon-50"
  >
    <ng-icon name="lucideX" size="15px" aria-hidden="true" />
  </button>
</div>
