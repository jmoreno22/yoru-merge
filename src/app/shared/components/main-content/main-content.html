@if (!repo.isOpen()) {
  <div class="flex min-h-0 flex-1">
    <app-repo-manager class="flex-1" />
  </div>
} @else {
  <app-repo-state-banner />

  <div class="flex min-h-0 min-w-0 flex-1" data-testid="repo-workbench">
    @if (appearance.showSidebar()) {
      <!-- `order` rather than flex-row-reverse: reversing the container would
           also flip the centre column and the inspector inside it. -->
      <app-sidebar
        class="shrink-0 border-[var(--app-border)]"
        [class.border-r]="sidebarSide() === 'left'"
        [class.border-l]="sidebarSide() === 'right'"
        [class.transition-[width]]="!sidebarDragging()"
        [class.duration-200]="!sidebarDragging()"
        [style.width.px]="sidebarPx()"
        [style.order]="sidebarSide() === 'left' ? 1 : 3"
      />
      <app-splitter
        orientation="vertical"
        [value]="prefs.sidebarWidth()"
        [style.order]="2"
        (resizeStart)="onSidebarDragStart()"
        (resize)="onSidebarResize($event)"
        (resizeEnd)="onSidebarDragEnd()"
        data-testid="splitter-sidebar"
      />
    }

    <div
      #split
      class="flex min-h-0 min-w-0 flex-1"
      [class.flex-col]="inspectorPlacement() === 'bottom'"
      [style.order]="sidebarSide() === 'left' ? 3 : 1"
    >
      <section
        class="flex min-h-0 min-w-0 shrink-0 flex-col border-[var(--app-border)] bg-[var(--app-surface)]"
        [class.border-r]="inspectorPlacement() === 'right'"
        [class.border-b]="inspectorPlacement() === 'bottom'"
        [class.transition-[width]]="!workbenchDragging()"
        [class.duration-200]="!workbenchDragging()"
        [style.width.px]="inspectorPlacement() === 'right' ? centrePx() : null"
        [style.height.px]="inspectorPlacement() === 'bottom' ? centrePx() : null"
        data-testid="centre-column"
      >
        @switch (view()) {
          @case ('changes') {
            <div class="flex min-h-0 flex-1 flex-col">
              <app-working-changes />
            </div>
          }
          @case ('reflog') {
            <div class="flex min-h-0 flex-1 flex-col">
              <app-reflog-view />
            </div>
          }
          @default {
            <app-commit-search />
            <div class="flex min-h-0 min-w-0 flex-1">
              @if (graphWidth() > 0) {
                <app-branch-graph
                  class="shrink-0 border-r border-[var(--app-border)]/60"
                  [style.width.px]="graphWidth()"
                  [graphData]="repo.graphData()"
                  [scrollTop]="repo.listScrollTop()"
                  [rowHeight]="appearance.rowHeight()"
                />
              }
              <div class="flex min-w-0 flex-1 flex-col">
                <app-commit-list [showSearch]="false" />
              </div>
            </div>
          }
        }
      </section>

      <app-splitter
        [orientation]="inspectorPlacement() === 'right' ? 'vertical' : 'horizontal'"
        [value]="prefs.workbenchSplit()"
        (resizeStart)="onWorkbenchDragStart()"
        (resize)="onWorkbenchResize($event)"
        (resizeEnd)="onWorkbenchDragEnd()"
        data-testid="splitter-workbench"
      />

      <section
        class="flex min-h-0 min-w-0 flex-1 flex-col bg-[var(--app-bg)]"
        data-testid="inspector-column"
      >
        @if (view() !== 'changes') {
          <div class="flex min-h-0 flex-[2] flex-col">
            <app-commit-inspector />
          </div>
        }

        <div
          class="flex min-h-0 flex-[3] flex-col border-t border-[var(--app-border)]"
        >
          <app-diff-viewer
            (openBlame)="onOpenBlame($event)"
            (openHistory)="onOpenFileHistory($event)"
          />
        </div>

        @if (blameFile(); as file) {
          <div
            class="flex min-h-0 flex-[3] flex-col border-t border-[var(--app-border)]"
          >
            <app-blame-viewer
              class="block h-full min-h-0"
              [file]="file"
              [rev]="blameRev()"
              (close)="onCloseBlame()"
            />
          </div>
        }

        @if (fileHistoryFile(); as file) {
          <div
            class="flex min-h-0 flex-[2] flex-col border-t border-[var(--app-border)]"
          >
            <app-file-history-panel
              class="block h-full min-h-0"
              [file]="file"
              (close)="onCloseFileHistory()"
              (selectCommit)="onSelectHistoryCommit($event)"
            />
          </div>
        }
      </section>
    </div>
  </div>
}
