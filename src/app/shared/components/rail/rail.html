<nav
  class="flex flex-1 flex-col items-center gap-1"
  aria-label="Workbench views"
  data-testid="rail-items"
>
  @for (item of items; track item.id) {
    <button
      type="button"
      [attr.aria-label]="item.label"
      [attr.aria-pressed]="isActive(item)"
      [yoruTooltip]="item.label"
      (click)="select(item)"
      [attr.data-rail-item]="item.id"
      [attr.data-active]="isActive(item) ? 'true' : null"
      class="relative flex size-10 items-center justify-center rounded-sm transition-colors"
      [class.text-neon-cyan]="isActive(item)"
      [class.bg-[var(--app-panel)]]="isActive(item)"
      [class.text-[var(--app-text-muted)]]="!isActive(item)"
      [class.hover:bg-[var(--app-panel)]]="!isActive(item)"
      [class.hover:text-[var(--app-text)]]="!isActive(item)"
    >
      @if (isActive(item)) {
        <span
          class="pointer-events-none absolute inset-y-1 left-0 w-[2px] rounded-full bg-neon-cyan"
          aria-hidden="true"
        ></span>
      }
      <ng-icon [name]="item.icon" size="18px" aria-hidden="true" />
      @if (badgeFor(item); as count) {
        <span
          class="absolute right-0.5 top-0.5 min-w-4 rounded-full bg-git-modified px-1 text-center font-mono text-[10.5px] font-bold leading-4 text-yoru-950"
          [attr.aria-label]="count + ' uncommitted changes'"
          data-testid="rail-changes-badge"
        >
          {{ count > 99 ? '99+' : count }}
        </span>
      }
    </button>
  }
</nav>

<button
  type="button"
  aria-label="Settings"
  [yoruTooltip]="'Settings'"
  (click)="openSettings()"
  data-testid="rail-settings"
  class="flex size-10 items-center justify-center rounded-sm text-[var(--app-text-muted)] transition-colors hover:bg-[var(--app-panel)] hover:text-[var(--app-text)]"
>
  <ng-icon name="lucideSettings2" size="18px" aria-hidden="true" />
</button>
