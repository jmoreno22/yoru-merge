<label class="flex flex-col gap-1.5">
  <span
    class="font-mono text-y-xs font-bold uppercase tracking-[0.12em] text-[var(--app-text-muted)]"
  >
    {{ label() }}
  </span>
  <ng-content />
  @if (error()) {
    <span class="text-y-sm text-git-deleted" role="alert">{{ error() }}</span>
  } @else if (hint()) {
    <span class="text-y-sm text-[var(--app-text-faint)]">{{ hint() }}</span>
  }
</label>
