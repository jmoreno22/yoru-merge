<span
  class="shrink-0 font-mono text-y-xs uppercase tracking-[0.12em] text-[var(--app-text-muted)]"
  [attr.data-side]="side()"
  [attr.data-testid]="chipTestId()"
>
  {{ chip() }}
</span>

@if (detail() !== "") {
  <span
    class="min-w-0 truncate font-mono text-xs text-[var(--app-text-muted)]"
    [title]="detail()"
  >
    {{ detail() }}
  </span>
}

<span
  class="min-w-0 truncate font-mono text-xs"
  [title]="parts().title"
  [attr.data-testid]="pathTestId()"
>
  <span class="text-[var(--app-text-faint)]">{{ parts().dirname }}</span
  ><span class="text-[var(--app-text)]">{{ parts().basename }}</span>
</span>
