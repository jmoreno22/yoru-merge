<div
  role="radiogroup"
  [attr.aria-label]="ariaLabel() || null"
  (keydown)="onKeydown($event)"
  class="inline-flex items-center gap-0.5 rounded-sm border border-[var(--app-border)] bg-[var(--app-surface)] p-0.5"
>
  @for (option of options(); track option.value) {
    <button
      #optionButton
      type="button"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [tabindex]="option.value === value() ? 0 : -1"
      (click)="select(option.value)"
      class="inline-flex h-6 items-center gap-1.5 rounded-[7px] px-2 text-xs transition-colors"
      [class]="
        option.value === value()
          ? 'bg-accent/15 text-accent-ink'
          : 'text-[var(--app-text-muted)] hover:bg-[var(--app-panel)] hover:text-[var(--app-text)]'
      "
    >
      @if (option.icon; as icon) {
        <ng-icon [name]="icon" size="14px" aria-hidden="true" />
      }
      <span>{{ option.label }}</span>
    </button>
  }
</div>
