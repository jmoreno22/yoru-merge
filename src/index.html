<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YoruMerge</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />

    <!-- Painted before styles.css arrives so the window never flashes white. -->
    <style>
      html {
        background: #f7faff;
        color-scheme: light;
      }
      html.dark {
        background: #050712;
        color-scheme: dark;
      }

      /* Startup splash (DESIGN.md › Startup splash). Styled here rather than in
       * styles.css so it is complete in the very first frame. Class names only:
       * the CSP drops inline style attributes. The base styles are the
       * finished mark and every animation only leads up to them, so motion
       * off is just removing the animations. The merge and the wordmark take
       * the accent, which theme-preboot.js has set by the time this paints. */
      .ys {
        --ys-accent: color-mix(
          in srgb,
          var(--app-accent, #00e5ff) 75%,
          var(--app-accent-text, #00697a)
        );
        --ys-violet: #8b4dff;
        --ys-pink: #f03ea8;
        --ys-bead: var(--app-accent-text, #00697a);
        --ys-glow: color-mix(in srgb, var(--ys-accent) 12%, transparent);
        position: fixed;
        inset: 0;
        z-index: var(--z-splash, 1400);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f7faff;
        user-select: none;
        transition: opacity 220ms ease;
      }
      html.dark .ys {
        --ys-accent: var(--app-accent, #00e5ff);
        --ys-violet: #9b5cff;
        --ys-pink: #ff4fb8;
        --ys-bead: #f4f8ff;
        --ys-glow: color-mix(in srgb, var(--ys-accent) 15%, transparent);
        background: #050712;
      }
      .ys.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .ys-mark {
        position: relative;
        width: 96px;
        height: 96px;
        transition: transform 220ms ease-in;
      }
      .ys.is-leaving .ys-mark {
        transform: scale(1.06);
      }
      .ys-halo {
        position: absolute;
        inset: -48px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--ys-glow), transparent 64%);
        animation:
          ys-fade 600ms ease-out 440ms both,
          ys-breathe 2400ms ease-in-out 1040ms infinite;
      }
      .ys-mark svg {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke-linecap: round;
      }
      .ys-c {
        stop-color: var(--ys-accent);
      }
      .ys-v {
        stop-color: var(--ys-violet);
      }
      .ys-p {
        stop-color: var(--ys-pink);
      }
      .ys-line {
        stroke-width: 3.2;
        stroke-dasharray: 1 2;
        animation: ys-draw 340ms cubic-bezier(0.22, 1, 0.36, 1) 100ms both;
      }
      .ys-stem {
        stroke: var(--ys-accent);
        animation-delay: 380ms;
        animation-duration: 180ms;
      }
      .ys-node {
        stroke-width: 3;
        transform-box: fill-box;
        transform-origin: center;
        animation: ys-pop 300ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .ys-node-v {
        stroke: var(--ys-violet);
      }
      .ys-node-p {
        stroke: var(--ys-pink);
        animation-delay: 50ms;
      }
      .ys-node-c {
        stroke: var(--ys-accent);
        animation-delay: 480ms;
      }
      .ys-comet {
        stroke: var(--ys-bead);
        stroke-width: 4.4;
        stroke-dasharray: 0.12 2;
        opacity: 0;
        animation: ys-flow 1600ms cubic-bezier(0.45, 0, 0.25, 1) 860ms infinite;
      }
      .ys-comet-late {
        animation-delay: 1660ms;
      }
      .ys-word {
        padding-left: 0.16em;
        font-family: "Zen Dots", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        font-size: 17px;
        line-height: 1;
        letter-spacing: 0.16em;
        color: var(--app-accent-text, #00697a);
        text-shadow: 0 0 8px color-mix(in srgb, var(--ys-accent) 45%, transparent);
        animation: ys-rise 480ms cubic-bezier(0.22, 1, 0.36, 1) 300ms both;
      }
      /* The same sign as the titlebar wordmark (.yoru-neon), so the handoff
       * between the two is one colour. */
      html.dark .ys-word {
        color: color-mix(in srgb, var(--ys-accent) 35%, #ffffff);
        text-shadow:
          0 0 1px var(--ys-accent),
          0 0 5px color-mix(in srgb, var(--ys-accent) 85%, transparent),
          0 0 12px color-mix(in srgb, var(--ys-accent) 55%, transparent);
      }
      /* The global motion-off rules in styles.css shorten durations but keep
       * the delays, which would assemble the mark in jumps. */
      @media (prefers-reduced-motion: reduce) {
        .ys * {
          animation: none !important;
        }
      }
      :root[data-animations="off"] .ys * {
        animation: none !important;
      }
      @keyframes ys-draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes ys-pop {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ys-flow {
        0% {
          stroke-dashoffset: 0.12;
          opacity: 0;
        }
        12%,
        80% {
          opacity: 0.9;
        }
        100% {
          stroke-dashoffset: -1;
          opacity: 0;
        }
      }
      @keyframes ys-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ys-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.12);
        }
      }
      @keyframes ys-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>

    <!-- Render-blocking on purpose: sets .dark before the first paint. -->
    <script src="assets/theme-preboot.js"></script>
  </head>
  <body>
    <!-- Removed by core/services/startup-splash.ts once the first view is final. -->
    <div id="yoru-splash" class="ys" aria-hidden="true">
      <div class="ys-mark">
        <div class="ys-halo"></div>
        <svg viewBox="0 0 64 64">
          <defs>
            <linearGradient id="ys-left" gradientUnits="userSpaceOnUse" x1="16" y1="12" x2="32" y2="38">
              <stop offset="0" class="ys-v" />
              <stop offset="1" class="ys-c" />
            </linearGradient>
            <linearGradient id="ys-right" gradientUnits="userSpaceOnUse" x1="48" y1="12" x2="32" y2="38">
              <stop offset="0" class="ys-p" />
              <stop offset="1" class="ys-c" />
            </linearGradient>
          </defs>
          <path class="ys-line" stroke="url(#ys-left)" pathLength="1" d="M18.6 15.6C25 24.5 32 27 32 36" />
          <path class="ys-line" stroke="url(#ys-right)" pathLength="1" d="M45.4 15.6C39 24.5 32 27 32 36" />
          <path class="ys-line ys-stem" pathLength="1" d="M32 36V47.5" />
          <path class="ys-comet" pathLength="1" d="M18.6 15.6C25 24.5 32 27 32 36V47.5" />
          <path class="ys-comet ys-comet-late" pathLength="1" d="M45.4 15.6C39 24.5 32 27 32 36V47.5" />
          <circle class="ys-node ys-node-v" cx="16" cy="12" r="4.5" />
          <circle class="ys-node ys-node-p" cx="48" cy="12" r="4.5" />
          <circle class="ys-node ys-node-c" cx="32" cy="52" r="4.5" />
        </svg>
      </div>
      <div class="ys-word">YoruMerge</div>
    </div>
    <app-root></app-root>
  </body>
</html>
