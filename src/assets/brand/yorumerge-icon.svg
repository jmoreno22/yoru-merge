<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  width="1024"
  height="1024"
  role="img"
  aria-label="YoruMerge"
>
  <title>YoruMerge</title>
  <desc>
    A cyan-to-violet crescent moon on a midnight ground, with a sakura branch
    node motif in the crescent's hollow. Source for src-tauri/icons via
    `pnpm tauri icon`.
  </desc>

  <defs>
    <!-- Mapped onto the crescent itself, not the 1024 square, so cyan (the
         primary) actually lands on the moon instead of on empty ground. -->
    <linearGradient
      id="moon"
      gradientUnits="userSpaceOnUse"
      x1="340"
      y1="230"
      x2="430"
      y2="790"
    >
      <stop offset="0" stop-color="#00E5FF" />
      <stop offset="0.5" stop-color="#3B82FF" />
      <stop offset="1" stop-color="#9B5CFF" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="0.78" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-sakura" cx="0.16" cy="0.88" r="0.62">
      <stop offset="0" stop-color="#FF4FB8" stop-opacity="0.18" />
      <stop offset="1" stop-color="#FF4FB8" stop-opacity="0" />
    </radialGradient>

    <!-- Crescent: the moon disc minus an offset disc. -->
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000000" />
      <circle cx="470" cy="500" r="300" fill="#FFFFFF" />
      <circle cx="616" cy="382" r="272" fill="#000000" />
    </mask>
  </defs>

  <!-- Ground -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#050712" />
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#glow-cyan)" />
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#glow-sakura)" />

  <!-- Moon -->
  <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)" />

  <!-- Branch nodes, sitting in the hollow the crescent leaves open -->
  <g
    fill="none"
    stroke="#FF6FBE"
    stroke-width="30"
    stroke-linecap="round"
  >
    <path d="M686 300 L686 548" />
    <path d="M686 424 C686 356 754 344 824 360" />
  </g>
  <circle cx="686" cy="300" r="46" fill="#FF6FBE" />
  <circle cx="686" cy="548" r="46" fill="#FF6FBE" />
  <circle cx="824" cy="360" r="46" fill="#FF6FBE" />
</svg>
